version: 2.1
jobs:
  build:
    macos:
      xcode: 12.4.0
    steps:
      - checkout
      - run:
          name: Run Unit Tests
          command: xcodebuild test -workspace Nasa.xcworkspace -scheme Nasa -destination 'platform=iOS Simulator,name=iPhone 12,OS=14.4'
      - run:
          name: Build Application
          command: xcodebuild -workspace Nasa.xcworkspace -scheme Nasa
workflows:
  version: 2
  build_and_test:
    jobs:
      - build